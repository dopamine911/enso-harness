<!doctype html>
<!-- class="dark" is the default theme's (Kanagawa Wave): `dark:` variants follow it. A light
     theme removes it (src/theme.ts); `data-theme` picks the theme, from the settings dialog.
     The variables live in src/styles/themes.css. -->
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<!-- A real relative path, not "/favicon.png": bun's HTML bundler resolves every
		     <link> href against this file and hard-fails on an absolute URL it cannot map
		     to a source file (#36). It bundles and content-hashes the icon; the copy in
		     public/ still serves the browsers that request /favicon.png out of habit. -->
		<link rel="icon" type="image/png" href="./public/favicon.png" />
		<title>Enso</title>
		<!-- The saved colour theme (src/theme.ts) on <html> before the first paint. INLINE on
		     purpose: bun bundles every <script src> into the app's deferred module, which would
		     run after a paint in the default theme. It copies the saved id, and drops the `dark`
		     class for a light theme. An id no theme block matches paints `.dark` (Kanagawa Wave),
		     or `:root` (Kanagawa Lotus) if its saved scheme was light, until main.tsx normalises it. The keys are THEME_STORAGE_KEY and THEME_SCHEME_STORAGE_KEY —
		     pinned by __tests__/theme.test.ts. -->
		<script>
			try {
				const saved = localStorage.getItem('enso:theme')
				if (saved) document.documentElement.dataset.theme = saved
				if (localStorage.getItem('enso:theme-scheme') === 'light') document.documentElement.classList.remove('dark')
			} catch {
				// Storage refused (private mode, a policy): the default theme stands.
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
