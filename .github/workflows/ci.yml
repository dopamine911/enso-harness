# CI — the enforced quality gate.
#
# Runs the SAME gate as the local pre-commit hook (`bun run check:all` = biome → tsc → fallow →
# react-doctor → bun test → the total-coverage floor → typedoc → the docs site and its link
# crawl), so "green"
# means one thing whether it ran on a machine or here. A commit made with `--no-verify`, or by
# someone without the hook installed, is caught at the PR instead of slipping into main.
#
# The coverage floor needs no separate step: it is gate 6 inside check:all
# (scripts/check-coverage.ts — the TOTAL floor bun's own per-file coverageThreshold
# cannot express; see that file's header for the 2026-09-04 measurement). Nor does the site:
# gate 8 builds it and crawls every built page for dead links (scripts/docs/site-links.ts).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Required so `gate` still runs — and can satisfy the required-status-check on `main` —
  # when a PR merges through a merge queue instead of a direct merge. Without this, enabling
  # a merge queue would deadlock every merge: the required check would never fire.
  merge_group:

# A newer push to the same branch cancels an in-flight run — no point finishing stale CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4" # matches the `engines.bun` floor in package.json

      # The frozen form, not a plain install: it fails when the lockfile and package.json
      # disagree instead of silently resolving a different tree. `postinstall` runs
      # scripts/link-vendor-packages.ts, which materializes the vendor symlinks the
      # harness manifest points at — the same step every local install runs.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gate (biome + tsc + fallow baseline + tests + coverage floor)
        run: bun run check:all

  # ADVISORY, deliberately (#163): the blocking gate refuses a NEW dead-code finding; this
  # job adds what the baseline cannot see on a PR — a changed function over the complexity
  # ceiling, a semantic clone the diff introduces — and reports without blocking. Promote
  # by dropping continue-on-error once a week of PRs shows its verdicts are worth a block.
  #
  # Runs once per PR (open/reopen/ready-for-review), not on every push: this is advisory only
  # (never blocks a merge, unlike `gate`), so re-running it on each `synchronize` bought no
  # additional safety for real Actions-minutes cost. `gate` keeps running on every push — it
  # is the required check and its status must track the exact head SHA.
  fallow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    if: github.event_name == 'pull_request' && github.event.action != 'synchronize'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base branch, for `--base`

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The pinned dev dependency, never `bunx fallow@latest`: an audit that changes its
      # own rules between runs is not a signal.
      - name: fallow audit (advisory — never blocks)
        env:
          BASE_REF: ${{ github.base_ref }} # through env, never interpolated into the shell line
        run: bunx fallow audit --base "origin/$BASE_REF" --dead-code-baseline fallow-baseline.json

      # The duplication ratchet (#174): `.fallowrc.jsonc` → `duplicates.threshold` is today's
      # duplicated-line percentage; this step goes red when a PR raises it. Advisory here
      # for the same reason as the audit above — promote once it has caught a real one.
      - name: fallow dupes (advisory — the threshold is the ratchet)
        if: ${{ !cancelled() }} # its own verdict, even when the audit above is red
        run: bunx fallow dupes
