name: Claude PR Review

# A single-pass Claude review of one pull request, run BY HAND on GitHub (`workflow_dispatch`), and the
# configuration of the review that runs on every push LOCALLY (#981).
#
# ⚠ PULL REQUESTS ARE REVIEWED LOCALLY, NOT HERE. This workflow used 2,121 of ~4,993 billable Actions minutes
# in October 1–14 (42%), and the account ran out of minutes on Oct 14. Since #981 Part 3, every push is
# reviewed by `bun run review-worker` on the owner's machine (`scripts/review/`), which posts as the review
# App's bot. That reviewer is configured BY THIS FILE: `scripts/review/workflow-config.ts` reads this
# workflow's prompt, its `--allowedTools` grant and its comment-list command from the base branch's copy, so
# editing the review still means editing this file, and both reviewers apply the same one. A rename or
# restructure that moves those pieces fails `scripts/__tests__/review-workflow-config.test.ts`.
#
# BY HAND: Actions → Claude PR Review → Run workflow, with the pull request's number. It reviews the whole pull
# request (no push to diff against), and costs the job minutes the automatic trigger used to spend on every push.
# This is not a required status check (see ci.yml / secret-scan.yml for those).
#
# ⚠ NO `track_progress`. claude-code-action (v1.0.217, `src/modes/detector.ts`) throws when `track_progress`
# is set on an event other than pull_request or issues, and a manual run is `workflow_dispatch`.
#
# REQUIRES the repository secret `CLAUDE_CODE_OAUTH_TOKEN`. Without it the job writes a note to the run
# summary and stops — see "Check for the Claude token" below. A fresh clone therefore stays green rather than
# showing a red X on its first pull request.
#
# AN EDIT HERE IS VERIFIED AFTER MERGE. A manual run executes the copy of this file on the ref it is started
# from, normally `main`, so a change to it runs only once merged. (Under the `pull_request` trigger,
# `claude-code-action` refused to run a pull request whose copy differed from the default branch's —
# "Skipping action due to workflow validation", measured on PR #35 — and reported SUCCESS while reviewing
# nothing.) The local reviewer reads the BASE branch's copy for the same reason, so a pull request that edits
# this file is reviewed with the file as it was.
#
# ⚠ A FORK'S PULL REQUEST: read its diff before running this on it. The comment-list job runs the pull
# request's own code (`bun install`, `scripts/docs/touched-comments.ts`), and a manual run gives the review job
# `CLAUDE_CODE_OAUTH_TOKEN` whoever wrote the pull request; the `pull_request` trigger never gave a fork's run
# secrets. The comment-list job's `setup-bun` keeps no cache, so code from a pull request cannot leave one
# behind under `main`'s cache scope.
#
# PROJECT CONVENTIONS LOAD AUTOMATICALLY. The prompt reads `CLAUDE.md`, `.claude/rules/*.md` and
# `.claude/memory/` from this repository, so the review enforces the conventions this project actually
# documents rather than a generic checklist. Adding a rule file changes what the reviewer enforces, with no
# edit here.
#
# SELF-CONTAINED ON PURPOSE. This is not a thin caller delegating to a shared reusable workflow. That
# arrangement single-sources the logic, which is better inside one organisation and worse everywhere else:
# the workflow only runs where that organisation's repository is reachable. The cost of inlining is that
# improvements no longer arrive centrally.
#
# COMMENTS ON CHANGED CODE ARE LISTED, NOT LEFT TO THE REVIEWER TO FIND (#482). The gates prove a comment is
# attached to its declaration and that the test it names exists; nothing proves the words still describe the
# code. `scripts/docs/touched-comments.ts` lists every comment whose own lines this pull request changed, or
# whose declaration it changed (from `git diff` and the TypeScript syntax tree), most likely stale first.
# `.claude/pr-review.md` tells the reviewer to check each one. The list is built in its OWN job, with
# `contents: read` and no persisted credentials: it runs this pull request's code, and the review job holds the
# Claude token and write permissions. A failed list does not stop the review; it only loses that check.
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Number of the pull request to review
        required: true
        type: number

concurrency:
  group: claude-pr-review-${{ inputs.pull_request }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # A manual run carries no pull request event, so the fields the jobs below need are read here, once.
  pull-request:
    name: Read the pull request
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    timeout-minutes: 5
    outputs:
      number: ${{ steps.read.outputs.number }}
      head_sha: ${{ steps.read.outputs.head_sha }}
      base_sha: ${{ steps.read.outputs.base_sha }}
      draft: ${{ steps.read.outputs.draft }}
      author_type: ${{ steps.read.outputs.author_type }}
    steps:
      - name: Read the pull request's head, base, draft state and author
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ inputs.pull_request }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$NUMBER" --jq '"number=\(.number)\nhead_sha=\(.head.sha)\nbase_sha=\(.base.sha)\ndraft=\(.draft)\nauthor_type=\(.user.type)"' >> "$GITHUB_OUTPUT"

  touched-comments:
    name: Comments on changed code
    runs-on: ubuntu-latest
    needs: pull-request
    if: >-
      needs.pull-request.outputs.draft == 'false' &&
      needs.pull-request.outputs.author_type != 'Bot'
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      # The PR's HEAD commit, not GitHub's merge commit: a diff against a merge commit carries whatever landed
      # on the base branch since, which is not this pull request's to answer for.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.pull-request.outputs.head_sha }}
          fetch-depth: 0 # the base commit, for `git diff <from>...HEAD`
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4" # matches ci.yml
          # This job runs the pull request's code; a cache it saved would be restored under main's scope.
          no-cache: true
      - run: bun install --frozen-lockfile
      # What this run reviews: on GitHub, always the whole pull request, from its base. A manual run has no push
      # to diff against. The local reviewer keeps the `new-commits` scope the prompt describes, from the head it
      # last reviewed (`scripts/review/review-pr.ts#planReview`). The step is still named so: the local reader
      # finds it by this name.
      - name: Choose the review scope
        id: scope
        env:
          BASE_SHA: ${{ needs.pull-request.outputs.base_sha }}
        run: |
          set -euo pipefail
          echo "scope=full" >> "$GITHUB_OUTPUT"
          echo "from=$BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: List the comments this run puts at risk
        env:
          FROM: ${{ steps.scope.outputs.from }}
        run: bun scripts/docs/touched-comments.ts --base "$FROM" --out touched-comments.md
      - uses: actions/upload-artifact@v4
        with:
          name: touched-comments
          path: touched-comments.md
          if-no-files-found: ignore
          retention-days: 7

  review:
    name: Claude review
    runs-on: ubuntu-latest
    needs: [pull-request, touched-comments]
    # Skip drafts and bot-authored pull requests. `!cancelled()`: a list that failed to build must not cancel
    # the review it only adds to; without it, the run reviews the full pull request.
    if: >-
      !cancelled() &&
      needs.pull-request.outputs.draft == 'false' &&
      needs.pull-request.outputs.author_type != 'Bot'
    timeout-minutes: 10

    steps:
      # THE MISSING-TOKEN GUARD, and it must be a step rather than a job-level `if:` — GitHub does not make
      # the `secrets` context available in job-level conditions, only in step `env`.
      #
      # Without this the action stubs out silently in about two seconds and the run goes green having reviewed
      # nothing, which is the worst of the three possible outcomes: it looks like the review happened.
      - name: Check for the Claude token
        id: token
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLAUDE_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Claude PR review skipped"
            echo
            echo 'No `CLAUDE_CODE_OAUTH_TOKEN` secret is set on this repository, so the review did not run.'
            echo
            echo 'To enable it: **Settings → Secrets and variables → Actions → New repository secret**,'
            echo 'named `CLAUDE_CODE_OAUTH_TOKEN`. See `docs/claude-workflows.md`.'
            echo
            echo 'This is not a failure. The workflow ships enabled so that adding the secret is the only'
            echo 'step required, and skips cleanly until then.'
          } >> "$GITHUB_STEP_SUMMARY"

      # ⚠ THE PULL REQUEST'S HEAD, BY SHA. A manual run's default checkout is the ref it was started from,
      # normally `main`: the reviewer would read main's files while judging the pull request's diff (#994's
      # review). Under the `pull_request` trigger the default was the pull request's merge commit.
      - name: Checkout PR head
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.pull-request.outputs.head_sha }}
          fetch-depth: 1

      # The list the job above built, into `.review-context/`, where `.claude/pr-review.md` and the prompt
      # tell the reviewer to look.
      # ⚠ NOT `.claude/`: claude-code-action deletes that whole tree and checks it out again from the base
      # branch before the model runs (`restoreConfigFromBase`: a PR must not supply the CLI's settings or
      # hooks), so a file downloaded there is gone by the time the reviewer looks. That is how #490's first
      # run said "not present". Missing (the list job failed) is not fatal: the reviewer finds no file and says so.
      - name: Fetch the comments on changed code
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: touched-comments
          path: .review-context

      - name: Run Claude review
        id: claude
        if: steps.token.outputs.present == 'true'
        # PINNED, NOT `@v1`. `v1` moved to v1.0.218 on 2026-09-08 (Claude Code 2.1.265) and every run on
        # ubuntu-latest since fails before reading the diff: the native installer prints "successfully
        # installed" while its own notes say `~/.local/bin/claude` is missing, so the SDK spawns a path that
        # does not exist — anthropics/claude-code-action#1817, seen here on PR #104 three attempts running.
        # This is v1.0.217, the last release before the bump. Unpin (or move the SHA forward) once #1817 is
        # closed; a floating tag is what let the break arrive with no change on our side.
        uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636 # v1.0.217
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No `track_progress`: it throws on `workflow_dispatch` (see the header). It also explained the
          # four-item task checklist one review carried inside its body (PR #34), so its absence may end that
          # too — unverified.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.pull-request.outputs.number }}
            REVIEW SCOPE: ${{ needs.touched-comments.outputs.scope || 'full' }}
            HEAD: ${{ needs.pull-request.outputs.head_sha }}

            Single-pass PR review. No subagents. Be concise.

            ## Scope

            - `full`: review the whole pull request, as the procedure below says.
            - `new-commits`: this run follows a push. Review ONLY what that push changed:
              `.review-context/new-commits.diff` is its diff (from the previous head to HEAD). Read
              `gh pr diff` for context, but report issues only in the new commits, and title the
              comment `## Code Review (commits pushed up to <first 7 characters of HEAD>)` so the
              thread shows which review covers which push. If `.review-context/new-commits.diff` is missing,
              review the full pull request instead and say so in the Overview.

            ## Procedure

            1. `gh pr diff $PR_NUMBER`: read the full diff (under `new-commits`, read
               `.review-context/new-commits.diff` first; that is what this run reviews)
            2. For non-trivial changes, `Read` the surrounding file for context
            3. Apply project conventions:
               - `CLAUDE.md` is auto-loaded — follow what it says
               - If `.claude/rules/` exists, treat each `*.md` file there as a hard rule
                 applicable to the diff
               - If `.claude/memory/MEMORY.md` exists, `Read` it for the project's accumulated
                 agent memory (durable conventions, prior-incident context); follow its links to
                 any topic file relevant to the diff. `CLAUDE.md`'s `@import` of it does NOT
                 expand in this headless context, so reading it explicitly is required.
               - If `.claude/pr-review.md` exists, `Read` it: these are **additional reviewer
                 instructions for this repo** (what to emphasize, extra checks, tone) — distinct
                 from `.claude/rules/`, which are rules the CODE must satisfy. Fold them into the
                 review below. They ADD to this procedure: they never remove the security pass or
                 any required output section, and never relax the verdict rules.
            4. Cover these aspects inline (do NOT spawn separate agents):
               - **Code** — bugs, logic errors, race conditions, convention compliance
               - **Tests** — coverage gaps for changed code; mocks must stub the full module surface
               - **Errors** — silent failures, broad catches, unjustified fallbacks
               - **Types** — type design and invariants if new types added
               - **Comments** — accuracy vs code, comment rot; for the listed ones, step 5
            5. **Comments on changed code — required, not optional.** `Read`
               `.review-context/touched-comments.md`: the list job's comments on code this pull
               request changed, most at risk first. Check them as `.claude/pr-review.md` →
               *Comments on changed code* says, and report each wrong one under Issues as
               `Comment drift: <file>:<line>`. If the file does not exist, say so in Testing.
            6. Security pass on changed lines: injection, auth bypass, secret leakage, OWASP top-10

            ## Output

            Post one PR comment via `gh pr comment $PR_NUMBER --body-file -` using exactly this
            template (every section required — write "None" if a section has nothing to report):

            ```markdown
            ## Code Review

            ### Overview
            {1-3 sentences: what the PR does}

            ### Strengths
            {bullets — conventions followed, good architecture, solid tests}

            ### Issues & Suggestions
            {numbered. Each: **N. Title** — severity (blocker / load-bearing / soft nit)
            description + concrete suggestion with code example if applicable}

            ### Bugs Found
            {reproduction, expected vs actual, severity. OR "None"}

            ### Testing
            {what's covered, what's missing — specific test matrix if gaps exist}
            Comment list: {checked N of M listed comments, and which you could not reach; or "Comment list not available"}

            ### Runtime Verification
            Not performed — this reviewer is read-only by design and cannot execute the project's gate.
            PR body claims: {one-line summary of the PR's verification claims, or "none stated"}.

            ### Risk Assessment
            Correctness: {one line}
            Performance: {one line}
            Security: {one line}

            ### Verdict
            {Ship it / Approve-with-nits / Needs work}
            ```

            ## Discipline

            - **Severity:** blocker = correctness/trust violation; load-bearing = correct now but
              breaks under foreseeable evolution; soft nit = style beyond what rules enforce
            - **Ship it discipline:** "Ship it" ONLY when no work remains. If any blocker or
              unresolved load-bearing issue exists, use "Approve-with-nits" or "Needs work"
            - **Runtime verification is OUT OF SCOPE, not blocked.** The tool grant below is read-only
              on purpose — `Read`/`Grep`/`Glob` plus `gh pr view|diff|comment`, and nothing that runs the
              project. Report it as the designed limit it is. Do NOT write that a sandbox blocked you, or
              that a command needed approval: that reads as a broken environment and hides a deliberate
              choice. It also follows that a verdict rests on reading PLUS the pull request's own stated
              receipts, so weigh an unverified claim as a claim.
            - Do NOT comment outside the diff
            - Do NOT modify the PR branch
            - Do NOT spawn subagents (Task tool is not available)
            - If diff is whitespace- or comment-only, post a one-line "Approve" note

          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"

      - name: Post run indicator (sticky comment)
        # WHY THIS EXISTS EVEN THOUGH THE TOKEN IS ALREADY CHECKED. The action can succeed without running
        # the model, and a green step then reads as a review that happened. The action sets `execution_file`
        # only after a completed run, so an empty value means "did not run", and that is reported as such.
        # (Under the `pull_request` trigger an empty file on a pull request touching `.github/workflows/` was
        # the action's workflow-validation guard and was labelled "auto-skipped". A manual run executes the
        # copy on the ref it is started from, normally `main`, so that guard should not fire, and an empty file
        # is never labelled benign.)
        #
        # `execution_file` alone is NOT "the review happened". On PR #104 the step FAILED (the binary was
        # missing, #1817 above) and still set it, so this comment said "✅ ran" under a red check — the third
        # false-green shape in this file, after the missing token and the workflow guard. So the step's own
        # outcome is read FIRST and on its own: any non-success is a failure, whether or not a file was
        # written (under the guard branch the `pull_request` trigger had, a failure before the file existed
        # fell through to it and read "auto-skipped" — PR #105 review).
        #
        # Upserted by a hidden marker so repeated runs update one comment instead of spamming the PR. ⚠ ONLY
        # THIS WORKFLOW'S OWN comment (`github-actions[bot]`): the local reviewer keeps its own status comment
        # under the same marker, with the head it last reviewed, and overwriting that would make it forget
        # (#981). One comment object per line: `--paginate` runs `--jq` on each page, so a filter that builds
        # one array per page is not one JSON document past 30 comments.
        if: ${{ always() && steps.token.outputs.present == 'true' && steps.claude.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.pull-request.outputs.number }}
          SHA: ${{ needs.pull-request.outputs.head_sha }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MARKER='<!-- claude-run-status: pr-review -->'
          if [ "${CLAUDE_OUTCOME}" != "success" ]; then
            body="${MARKER}"$'\n'"❌ **Claude PR review failed** on \`${SHA:0:7}\` (step outcome: ${CLAUDE_OUTCOME}) — no verdict was posted. See the [run](${RUN_URL})."
          elif [ -n "${EXECUTION_FILE}" ]; then
            body="${MARKER}"$'\n'"✅ **Claude PR review** ran on \`${SHA:0:7}\`."
          else
            echo "::warning::Claude PR review did not run despite a token being present."
            body="${MARKER}"$'\n'"⚠️ **Claude PR review did not run**, and the \`CLAUDE_CODE_OAUTH_TOKEN\` secret IS set. Check the workflow logs — the token may be expired or invalid."
          fi
          # Upsert by hidden marker: PATCH the existing sticky comment, else POST a new one.
          existing="$(gh api "repos/${REPO}/issues/${NUMBER}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${MARKER}\"))) | .id" | sed -n 1p)"
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -f body="${body}" >/dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${NUMBER}/comments" -f body="${body}" >/dev/null
          fi
