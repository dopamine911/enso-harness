# Docs site — built and published ON REQUEST, never on a push.
#
# Manual by design. The site is a build product of `docs/` and TypeDoc, and `bun run check:all`
# already builds it and crawls its links on every PR (gate 12), so a push-triggered publish would
# spend Actions minutes re-proving what the gate just proved. What this workflow adds is the one
# thing the gate does not do: put the built site somewhere a person can read it.
#
# ⚠ THE BASE PATH AND ORIGIN ARE DERIVED, NEVER LITERALS. Where Pages serves the site decides
# both: a project site is served from `/<repository>` on `<owner>.github.io`, and a custom
# domain (`enso.engineer`, #506) from `/` on that domain. A site built with the wrong `base`
# produces working HTML whose every internal link 404s — the failure looks like broken
# documentation and is really one wrong string. So neither is written here: `configure-pages`
# reads them from the Pages configuration itself (its `html_url`), and `ENSO_SITE_BASE` /
# `ENSO_SITE_URL` carry them to `scripts/docs/site-base.ts`, the single reader the projector, the
# link crawl and Astro share. Adding, changing or dropping the domain, renaming the repository or
# forking it all publish correctly without anyone editing this file.
#
# `deploy` is opt-in per run. Pages has to be enabled for the repository with "GitHub Actions"
# as its source, because the base comes from its configuration: without Pages the build fails at
# `configure-pages` rather than guessing a base.
name: Docs site

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish to GitHub Pages (requires Pages enabled, source = GitHub Actions)
        type: boolean
        default: false

# One publish at a time, and a newer request wins: two concurrent deployments of the same site
# race for the same Pages deployment slot.
concurrency:
  group: docs-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # `configure-pages` reads the site's URL from the Pages configuration
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4" # matches the `engines.bun` floor in package.json

      # The frozen form, as everywhere else: it fails when the lockfile and package.json
      # disagree rather than silently resolving a different tree.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # TypeDoc first, and it emits nothing: the step VALIDATES the documented surface with
      # warnings fatal. The site generates its own API pages from the same `typedoc.json`, so
      # this ordering buys fail-fast, not an artifact.
      - name: Validate the documented API surface
        run: bun run docs:api

      # Where Pages serves the site: `base_path` is `/zen-harness-foundation` on github.io and
      # empty on a custom domain, `origin` the scheme and host either way (#506).
      - name: Read where Pages serves the site
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the site and crawl its links
        env:
          ENSO_SITE_BASE: ${{ steps.pages.outputs.base_path }}
          ENSO_SITE_URL: ${{ steps.pages.outputs.origin }}
        run: bun run docs:site

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # the deployment itself
      id-token: write # the OIDC token `deploy-pages` exchanges for it
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
