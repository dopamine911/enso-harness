name: Secret Scan (gitleaks)

# Fails any change that INTRODUCES a committed secret — private keys, tokens, cloud credentials.
# Designed to be a REQUIRED status check.
#
# WHY THIS IS ON BY DEFAULT. A committed secret is permanent: rewriting history does not un-leak it, because
# anyone who cloned or forked in the interval still has it, and the only real remedy is rotation. Catching
# one at the PR boundary costs a few seconds of CI; missing one costs a rotation scramble and an unknown
# exposure window. That asymmetry is why this ships enabled rather than opt-in.
#
# NO SECRETS OR TOKENS REQUIRED. gitleaks is the MIT-licensed binary, and the only credential used is the
# `github.token` that GitHub provides automatically. There is nothing to configure before this works.
#
# SCOPED TO NEW COMMITS ONLY (base..head), never the whole tree. That is what makes it safe to mark REQUIRED
# on an existing repository: it will not red-X every open pull request over secrets committed before this
# workflow existed. Clean those up separately — and rotate them.
#
# TRIGGER POLICY — changed to run ONCE per merge instead of once per push (was: opened / synchronize /
# reopened / ready_for_review). Rationale: `synchronize` re-scanned on every push at ~0.3 min/run, cheap in
# isolation, but it was one of three PR-triggered workflows doing that; cut here because a secret introduced
# and then pushed over still gets caught below, whereas a straight per-push cut on a REQUIRED check risks a
# merge deadlock (see the note below) unless paired with a merge queue, which this repository now requires
# on `main`.
#   merge_group — now the ONLY pre-merge scan, and it is authoritative: it runs on the exact merge commit a
#                 merge-queue entry produces, immediately before that commit reaches `main`. Requires
#                 "Require merge queue" enabled in this branch's protection rule — without it, `merge_group`
#                 never fires, and this required check would never receive a status for any commit, which is
#                 a permanent merge deadlock, not a soft degradation. Do not remove `pull_request` here again
#                 without confirming the merge queue requirement is (still) on.
#   push to main — the backstop, and the reason the set was never PR-only (#259). The blocking gate in
#                  ci.yml runs on `push: [main]`; this did not, so a commit that reached main by any path
#                  other than the merge queue (an admin bypass, a direct push if one is ever permitted) got
#                  the full check:all and no gitleaks pass. It is a backstop, not the primary catch: a secret
#                  found here is already pushed and must be ROTATED, not just removed. The range is
#                  `github.event.before..github.sha`, with the fallbacks the run step documents.
#
# LOST BY THIS CHANGE: the "Comment findings on the PR" step below only fires on
# `github.event_name == 'pull_request'`, which no longer happens — a finding still fails the check and
# uploads `gitleaks-report.json` as a build artifact, it just no longer gets a friendly inline PR comment.
# `pull-requests: write` in `permissions:` is kept for that step rather than removed, since restoring
# PR-triggered visibility is the likely next iteration if the merge-queue-only UX proves too quiet.
#
# DO NOT reduce the `pull_request` trigger set (if restored) to `opened` only while this is a required
# check outside a merge queue. A later push would leave the required check unsatisfied on the new SHA — a
# merge deadlock — and a secret added after opening would go unscanned.
#
# MERGE COMMITS ARE SCANNED (#209). A merge commit's conflict resolution is content that
# exists in neither parent, so a secret written while resolving a `Merge branch 'main' into …`
# on a pull-request branch would reach `main` unscanned — this repository merges rather than
# squashes, so branch-local merge commits do land. `--diff-merges=first-parent` (git ≥ 2.31)
# walks each merge's own diff against its first parent without touching TRAVERSAL, which is
# the distinction that matters: `--first-parent` would instead drop every commit reached
# through a second parent, losing a secret that was committed on a side branch and then
# removed while resolving — a case the old `--no-merges` did catch. Measured on this
# repository, 86 commits and 25 merges: 243 ms against 263 ms for `--no-merges`, i.e. free.
# `test/secret-scan-gate.test.ts` holds the range this file passes.
#
# FALSE POSITIVES: THIS REPOSITORY HAS A `.gitleaks.toml` at its root, so that file is the live allowlist
# and the baseline below is not applied — edit the file, not the baseline. Read the note above the
# baseline anyway: it names the one line people omit that silently disables all secret detection, and
# `test/secret-scan-gate.test.ts` asserts both that line and that the file keeps every baseline pattern.
on:
  merge_group:
  push:
    branches: [main]

# `github.event.pull_request.number` stays first in this key even though `pull_request` is no longer a
# trigger: harmless (it simply evaluates empty), and restores the exact same group if that trigger comes
# back. The push-to-main fallback is `github.sha` rather than `github.ref`: a per-commit group means two
# pushes to main never share one, so `cancel-in-progress` cannot reach them. Cancelling the backstop for
# commit A because commit B arrived would leave A's range permanently unscanned, which is the one thing
# this job exists to prevent.
concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # to post one redacted findings comment on failure (PR events only)

env:
  # Pinned deliberately. Bump it as a considered change: a gitleaks minor can add rules, which would fail a
  # pull request for a finding that did not exist yesterday and that nobody in the PR introduced.
  GITLEAKS_VERSION: "8.18.4"

jobs:
  secret_scan:
    name: secret-scan # this string is the required-status-check context; renaming it breaks the branch rule
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (full history, so the PR or merge range resolves)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Cache the pinned binary so most runs skip the download entirely.
      - name: Restore cached gitleaks
        id: cache_gitleaks
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-${{ runner.os }}-${{ env.GITLEAKS_VERSION }}

      - name: Install gitleaks (cache miss only)
        if: steps.cache_gitleaks.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          mv gitleaks "$HOME/.local/bin/gitleaks"
          chmod +x "$HOME/.local/bin/gitleaks"

      - name: Put gitleaks on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan new commits (redacted)
        id: gitleaks
        env:
          # base..head from whichever event triggered this run. On `push` that is the branch's previous
          # tip and the new one; the run body repairs the two cases where `before` is not a usable base.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -uo pipefail
          gitleaks version
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "::error::No base/head SHAs in context — refusing to pass a required gate without a range to scan."
            echo "code=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `github.event.before` is not always a base you can diff from: it is forty zeroes when the
          # branch was just created, and it is an unreachable object after a force-push that dropped it.
          # Either way the scan must still cover the new commit rather than pass with nothing to read —
          # this gate's failure is the irreversible one. The commit's first parent is that coverage: on a
          # merge to main it is the previous main tip, so the range is exactly what landed.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            fallback=$(git rev-parse --verify --quiet "${HEAD_SHA}^") || fallback=''
            if [ -z "${fallback}" ]; then
              echo "::error::${HEAD_SHA} has no parent and ${BASE_SHA} is not in this checkout — no range to scan."
              echo "code=2" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::Base ${BASE_SHA} is unusable (new branch or force-push); scanning ${fallback}..${HEAD_SHA} instead."
            BASE_SHA="${fallback}"
          fi

          # CONFIG PRECEDENCE, and the trap inside it.
          #
          # gitleaks auto-detects a `.gitleaks.toml` at the repository root, and that file REPLACES the
          # default ruleset. So this workflow must NOT pass `--config` when one exists, or it would override
          # the repository's own allowlist. Only when there is no config does it apply the baseline below.
          #
          # THE TRAP: a `.gitleaks.toml` without `[extend] useDefault = true` silently disables EVERY
          # built-in rule. The scan then passes on everything and looks exactly like a clean result. If you
          # write your own config, that line is not optional.
          #
          # The baseline keeps all default rules and allowlists only provably-non-secret placeholders, so a
          # new project does not spend its first pull request rediscovering the same false positives. Two
          # mechanisms share one allowlist:
          #   1. A SENTINEL string. Any fake credential embedding `notarealsecret` is allowed, for every
          #      rule. Because the sentinel is specific and unusual, a real leaked secret never contains it,
          #      so detection is unaffected. Use it in fixtures and examples.
          #   2. A few INDUSTRY-CANONICAL literals people paste verbatim and that carry no sentinel: AWS's
          #      documentation account IDs and example keys, and the jwt.io sample token.
          #
          # A private key cannot embed a sentinel — it is base64 — so allow those case by case with an
          # inline `# gitleaks:allow` comment on the offending line.
          #
          # NOTE: gitleaks 8.18.x accepts a SINGLE [allowlist] table. The [[allowlist]] array-of-tables form
          # fails to parse on this version, which is why every pattern shares one `regexTarget = "line"`.
          config_args=()
          if [ -f .gitleaks.toml ]; then
            echo "::notice::Using this repository's own .gitleaks.toml — the baseline allowlist is not applied."
          else
            baseline="${RUNNER_TEMP}/baseline.gitleaks.toml"
            cat > "${baseline}" <<'TOML'
          [extend]
          useDefault = true

          [allowlist]
          description = "Baseline: the 'notarealsecret' sentinel plus industry-canonical example values"
          regexTarget = "line"
          regexes = [
            # (1) The sentinel. Any fake credential embedding this literal is allowed, for any rule.
            '''(?i)notarealsecret''',
            # (2a) AWS documentation account IDs, reserved by AWS so no real resource can live in them.
            # Scoped to these two accounts, so an ARN in a REAL account is still scanned.
            '''arn:aws:[a-z0-9-]*:[a-z0-9-]*:(?:111111111111|123456789012):''',
            # (2b) AWS's canonical example access-key / secret-key pair from its own documentation.
            '''AKIAIOSFODNN7EXAMPLE''',
            '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
            # (2c) The jwt.io canonical sample token. Base64 cannot carry the sentinel.
            '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ\.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c''',
          ]
          TOML
            config_args=(--config "${baseline}")
            echo "::notice::No .gitleaks.toml in this repository — applied the baseline allowlist (the 'notarealsecret' sentinel plus canonical AWS/JWT example values)."
          fi

          # --redact so a secret value is never printed into a log that is often world-readable.
          # --log-opts scopes the scan to this PR's new commits. Exit codes: 0 clean, 1 leaks, >1 error.
          # `--diff-merges=first-parent` walks each merge commit's own diff, so a secret written
          # while resolving a conflict is scanned (#209 — see the header, and the range is pinned
          # by test/secret-scan-gate.test.ts).
          # `detect` is the history-scan command on 8.18.x; it becomes `gitleaks git` on 8.19 and later.
          set +e
          gitleaks detect \
            --source . \
            "${config_args[@]}" \
            --redact \
            --no-banner \
            --log-opts="--diff-merges=first-parent ${BASE_SHA}..${HEAD_SHA}" \
            --report-format json \
            --report-path gitleaks-report.json
          code=$?
          set -e
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "gitleaks exit code: ${code}"

      - name: Comment findings on the PR (redacted)
        if: steps.gitleaks.outputs.code == '1' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          count=$(jq 'length' gitleaks-report.json)
          {
            echo "## 🔐 Secret scan — blocked"
            echo
            echo "gitleaks found **${count}** potential secret(s) in this pull request's new commits. Values are redacted below."
            echo
            echo "| File | Line | Rule | Commit |"
            echo "|---|---|---|---|"
            jq -r '.[] | "| \(.File) | \(.StartLine) | \(.RuleID) | \(.Commit[0:7]) |"' gitleaks-report.json
            echo
            echo "**To resolve:** remove the secret, **rotate it — assume it is already compromised** — and re-push."
            echo
            echo "**False positive?** Canonical AWS example values, and any credential containing \`notarealsecret\`, are already allowlisted. For anything else add a \`.gitleaks.toml\` at the repository root and **include \`[extend] useDefault = true\`** — omitting that line silently disables *all* secret detection. For a single line, an inline \`# gitleaks:allow\` comment works."
          } > secret-scan-comment.md
          gh pr comment "$PR_NUMBER" --body-file secret-scan-comment.md

      - name: Upload gitleaks report
        if: steps.gitleaks.outputs.code != '0'
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

      - name: Fail the check if secrets were found
        if: steps.gitleaks.outputs.code != '0'
        run: |
          echo "::error::Secret scan failed — new commits introduce one or more secrets (see the pull request comment). Secrets must not enter source control."
          exit 1
